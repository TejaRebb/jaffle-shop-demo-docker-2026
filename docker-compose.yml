services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jaffle_shop_dw
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jaffle_shop_dw"]
      interval: 5s
      timeout: 5s
      retries: 10

  dbt:
    build: .
    image: dbt-jaffle-shop-latest
    volumes:
      - .:/usr/src/dbt
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: